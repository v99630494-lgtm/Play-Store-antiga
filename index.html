<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Play Store 1980 - APK Edition</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #02020f;
            color: #33ff33;
            font-family: 'Courier New', Courier, monospace;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        header {
            text-align: center;
            margin-bottom: 25px;
            border: 3px double #33ff33;
            padding: 12px;
            background-color: #000;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 0 10px rgba(51, 255, 51, 0.3);
        }
        h1 {
            font-size: 1.3rem;
            letter-spacing: 2px;
        }
        .subtitle {
            font-size: 0.75rem;
            color: #11aa11;
            margin-top: 5px;
        }
        .vitrine {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            max-width: 450px;
        }
        .item-jogo {
            background-color: #000;
            border: 2px solid #33ff33;
            padding: 15px;
            border-radius: 4px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .titulo-jogo {
            font-size: 1.1rem;
            font-weight: bold;
            color: #ffff33;
        }
        .desc-jogo {
            font-size: 0.8rem;
            color: #22cc22;
        }
        .btn-instalar {
            background-color: #33ff33;
            color: #000;
            border: none;
            padding: 12px;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            font-size: 0.95rem;
            cursor: pointer;
            text-transform: uppercase;
            text-align: center;
        }
        .btn-instalar:active {
            background-color: #11aa11;
            color: #fff;
        }
        #status {
            margin-top: 20px;
            font-size: 0.9rem;
            color: #ff33ff;
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <header>
        <h1>VINTAGE MARKET 1980</h1>
        <div class="subtitle">SISTEMA DE EMPACOTAMENTO APK DIRECT</div>
    </header>

    <div class="vitrine">
        <!-- APP 1 -->
        <div class="item-jogo">
            <div class="titulo-jogo">👾 SPACE INVADERS RETRÔ</div>
            <div class="desc-jogo">Formato: Aplicativo Android (.apk)<br>Destino: Pasta de Transferências</div>
            <button class="btn-instalar" onclick="baixarFalsoApk('SpaceInvaders1980.apk')">Baixar Instalador APK</button>
        </div>

        <!-- APP 2 -->
        <div class="item-jogo">
            <div class="titulo-jogo">👁️ ALUCINAÇÕES NA MANSÃO</div>
            <div class="desc-jogo">Formato: Aplicativo Android (.apk)<br>Destino: Pasta de Transferências</div>
            <button class="btn-instalar" onclick="baixarFalsoApk('MansaoTerror2D.apk')">Baixar Instalador APK</button>
        </div>
    </div>

    <div id="status"></div>

    <script>
        function baixarFalsoApk(nomeArquivo) {
            const statusDiv = document.getElementById('status');
            statusDiv.innerText = "Compilando pacotes binários dex de 1980...";

            setTimeout(() => {
                // Cria um arquivo binário simulado que o Android reconhece com a extensão .apk
                const dadosFalsos = new Uint8Array([0x50, 0x4B, 0x03, 0x04, 0x14, 0x00, 0x08, 0x00, 0x08, 0x00]); 
                const blob = new Blob([dadosFalsos], { type: 'application/vnd.android.package-archive' });
                const url = URL.createObjectURL(blob);
                
                const link = document.createElement('a');
                link.href = url;
                link.download = nomeArquivo; // Força o arquivo a ir como .apk verdadeiro para o gerenciador de arquivos
                document.body.appendChild(link);
                link.click();
                
                document.body.removeChild(link);
                URL.revokeObjectURL(url);

                statusDiv.innerText = `Pronto! Verifique suas notificações. O arquivo [${nomeArquivo}] está na sua pasta de Downloads.`;
            }, 1500);
        }
    </script>
</body>
</html>
